---
layout: default
---
<div class="wiki-layout">
  <aside id="sidebar">
    {% include sidebar.html %}
  </aside>
  <section id="content">
    <div id="welcome" class="placeholder">
      <h2>왼쪽에서 카테고리를 선택하세요</h2>
      <p>AI 툴로 "keystonewiki에 올려줘"라고 요청하면 이곳에 자동으로 정리되어 쌓입니다.</p>
    </div>
    <div id="entries" style="display:none;"></div>
  </section>
</div>

<!-- 모든 _data 를 JSON으로 페이지에 임베드. wiki.js 가 클라이언트에서 필터링/렌더링 -->
<script id="wiki-data" type="application/json">
{{ site.data | jsonify }}
</script>
<script src="{{ '/assets/js/wiki.js' | relative_url }}"></script>
