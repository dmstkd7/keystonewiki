name: Validate wiki data

on:
  push:
    paths:
      - "_data/**.json"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate _data JSON schema
        id: validate
        run: python3 scripts/validate_data.py

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ keystonewiki 데이터 검증 실패 (commit ${context.sha.slice(0,7)})`,
              body: `${context.actor}님의 최근 push에서 _data/*.json 검증에 실패했습니다.\n\n` +
                    `Action 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `해당 커밋을 되돌리거나(git revert), AI 툴에게 다시 정리해서 올려달라고 요청해주세요.`
            })
